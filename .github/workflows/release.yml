name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Verify tag matches Desktop version
        run: node -e "const p=require('./desktop/package.json'); if ('v'+p.version !== process.env.GITHUB_REF_NAME) { console.error('Tag must be v'+p.version); process.exit(1) }"
      - name: Install dependencies
        working-directory: desktop
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: true
      - name: Build
        working-directory: desktop
        run: npm run build
        env:
          NODE_ENV: production
      - name: Package
        working-directory: desktop
        run: npx electron-builder --config electron-builder.yml --publish never 2>&1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/dist/ContextVault-Setup-*.exe
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: true

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Verify tag matches Desktop version
        run: node -e "const p=require('./desktop/package.json'); if ('v'+p.version !== process.env.GITHUB_REF_NAME) { console.error('Tag must be v'+p.version); process.exit(1) }"
      - name: Install dependencies
        working-directory: desktop
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: true
      - name: Build
        working-directory: desktop
        run: npm run build
        env:
          NODE_ENV: production
      - name: Package
        working-directory: desktop
        run: npx electron-builder --config electron-builder.yml --publish never 2>&1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/dist/ContextVault-*.AppImage
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: true

  release:
    needs: [build-windows, build-linux]
    if: success()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Finalize Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ContextVault ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: true
          body: |
            ## ContextVault ${{ github.ref_name }}

            ### Install
            - [Windows](https://context-vault-two.vercel.app/download/windows)
            - [Linux](https://context-vault-two.vercel.app/download/linux)

            macOS is currently available as a local source build with `npm run package:mac`.
