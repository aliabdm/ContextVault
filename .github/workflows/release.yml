name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install dependencies
        working-directory: desktop
        run: npm ci
      - name: Build
        working-directory: desktop
        run: npm run build
        env:
          NODE_ENV: production
      - name: Package
        working-directory: desktop
        run: npx electron-builder --config electron-builder.yml --publish never 2>&1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload installer
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: desktop/dist/ContextVault-Setup-*.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install dependencies
        working-directory: desktop
        run: npm ci
      - name: Build
        working-directory: desktop
        run: npm run build
        env:
          NODE_ENV: production
      - name: Package
        working-directory: desktop
        run: npx electron-builder --config electron-builder.yml --publish never 2>&1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          CSC_LINK: ''
          CSC_KEY_PASSWORD: ''
      - name: Upload installer
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: installer-macos
          path: desktop/dist/ContextVault-*.dmg

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq || true
          sudo apt-get install -y libgtk-3-0 libnotify4 libnss3 libxkbcommon0 \
            libxcomposite1 libxdamage1 libxrandr2 libxrender1 \
            libxtst6 libasound2 2>&1 || echo "Some deps may be missing, continuing..."
      - name: Install dependencies
        working-directory: desktop
        run: npm ci
      - name: Build
        working-directory: desktop
        run: npm run build
        env:
          NODE_ENV: production
      - name: Package
        working-directory: desktop
        run: npx electron-builder --config electron-builder.yml --publish never 2>&1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload installer
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: installer-linux
          path: desktop/dist/ContextVault-*.AppImage

  release:
    needs: [build-windows, build-linux]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          merge-multiple: true
        continue-on-error: true
      - name: Generate update metadata
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          if ls ContextVault-Setup-*.exe 2>/dev/null; then
            cat > latest.yml << EOF
            version: $VERSION
            path: ContextVault-Setup-$VERSION.exe
            sha512: $(sha256sum ContextVault-Setup-*.exe | cut -d' ' -f1)
            releaseDate: $(date -u +%Y-%m-%dT%H:%M:%S.000Z)
            files:
              - url: ContextVault-Setup-$VERSION.exe
                sha512: $(sha256sum ContextVault-Setup-*.exe | cut -d' ' -f1)
                size: $(stat -c%s ContextVault-Setup-*.exe)
            EOF
          fi
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ContextVault ${{ github.ref_name }}
          body: |
            ## ContextVault ${{ github.ref_name }}

            ### Install
            - [Windows](https://context-vault-two.vercel.app/download/windows)
            - [macOS](https://context-vault-two.vercel.app/download/macos)
            - [Linux](https://context-vault-two.vercel.app/download/linux)

            ### Download
            | Platform | File |
            |----------|------|
            | Windows | ContextVault-Setup-${{ github.ref_name }}.exe |
            | macOS | ContextVault-${{ github.ref_name }}-x64.dmg (Intel) |
            | macOS | ContextVault-${{ github.ref_name }}-arm64.dmg (Apple Silicon) |
            | Linux | ContextVault-${{ github.ref_name }}.AppImage |
          files: |
            *.exe
            *.dmg
            *.AppImage
            latest.yml
          generate_release_notes: true
          fail_on_unmatched_files: false
