name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install dependencies
        working-directory: desktop
        run: npm ci
      - name: Build
        working-directory: desktop
        run: npm run build
        env:
          NODE_ENV: production
      - name: Package
        working-directory: desktop
        run: npx electron-builder --config electron-builder.yml --publish never 2>&1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload installer
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: |
            desktop/dist/ContextVault-Setup-*.exe
            desktop/dist/latest.yml

  build-macos:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Debug environment
        run: |
          node --version
          npm --version
          which npx || echo "npx not found"
          ls -la desktop/resources/
      - name: Install dependencies
        working-directory: desktop
        run: npm ci
      - name: Build
        working-directory: desktop
        run: npm run build
        env:
          NODE_ENV: production
      - name: Package
        working-directory: desktop
        run: |
          npx electron-builder --config electron-builder.yml --publish never 2>&1 || true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          CSC_LINK: ''
          CSC_KEY_PASSWORD: ''
          APPLE_ID: ''
          APPLE_ID_PASSWORD: ''
          APPLE_TEAM_ID: ''
          APPLE_APP_SPECIFIC_PASSWORD: ''
      - name: Upload installer
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: installer-macos
          path: desktop/dist/ContextVault-*.dmg

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq || true
          sudo apt-get install -y libgtk-3-0 libnotify4 libnss3 libxkbcommon0 \
            libxcomposite1 libxdamage1 libxrandr2 libxrender1 \
            libxtst6 libasound2 2>&1 || echo "Some deps may be missing, continuing..."
      - name: Install dependencies
        working-directory: desktop
        run: npm ci
      - name: Build
        working-directory: desktop
        run: npm run build
        env:
          NODE_ENV: production
      - name: Package
        working-directory: desktop
        run: npx electron-builder --config electron-builder.yml --publish never 2>&1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload installer
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: installer-linux
          path: desktop/dist/ContextVault-*.AppImage

  release:
    needs: [build-windows, build-linux, build-macos]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          merge-multiple: true
        continue-on-error: true
      - name: List artifacts
        run: ls -la *.exe *.dmg *.AppImage latest.yml 2>/dev/null || echo "No installers found"
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ContextVault ${{ github.ref_name }}
          body: |
            ## ContextVault ${{ github.ref_name }}

            ### Install
            - [Windows](https://context-vault-two.vercel.app/download/windows)
            - [macOS](https://context-vault-two.vercel.app/download/macos)
            - [Linux](https://context-vault-two.vercel.app/download/linux)

            ### Changelog
            See the commits for details.
          files: |
            *.exe
            *.dmg
            *.AppImage
          generate_release_notes: true
          fail_on_unmatched_files: false
          make_latest: true
